# +-----------------------------------------------------------------------+
# |  Nyx Anticheat                                                     |
# |  Nullify Your Xploits                                                 |
# |  Default values tuned for Paper 1.21+ with vanilla physics           |
# +-----------------------------------------------------------------------+
#
# MOVEMENT PHYSICS REFERENCE (blocks/tick @ 20 TPS):
#   Walk:       0.2159  (4.317 m/s)
#   Sprint:     0.2806  (5.612 m/s)  — ×1.30 walk
#   Sneak:      0.0648  (1.296 m/s)  — ×0.30 walk
#   Sprint-jump:0.3290  (6.580 m/s)  — ×1.17 sprint
#   Ice walk:   0.2159  (same accel, near-zero friction decay)
#   Ice sprint: 0.2806
#   Speed I:    +20% per tier
#   Slowness:   -15% per tier
#   Grav:       0.08  / tick²
#   Jump vel:   0.42  → 1.252 blocks height
#   Term vel:  -3.92  / tick
#   Water drag: 0.8/tick; Lava drag: 0.5/tick
#
# All values are unmodified vanilla. Adjust sensitivity up if you get FPs,
# or down if cheaters are bypassing. Start at 0.8 and move 0.05 at a time.
# +-----------------------------------------------------------------------+

general:
  # Prefix shown before all anticheat messages (MiniMessage format)
  prefix: "<gray>[<gradient:#ff6b6b:#ffd93d>Nyx</gradient>]</gray>"
  # Check for updates on startup
  check-for-updates: true

alerts:
  # Send violation alerts in chat
  enabled: true
  # Permission required to *receive* alerts (players with this get broadcasts)
  permission: "nyx.admin"
  # Cooldown between consecutive alerts for the same check+player (ms)
  cooldown: 1000
  # Show extra debug info in alerts (exact deltas, thresholds, etc.)
  verbose: false
  # Broadcast punishment messages to the whole server
  broadcast-punishments: true

performance:
  # Max players that run full checks (-1 = unlimited)
  max-checked-players: -1
  # How often (in ticks) heavy checks re-run.  1 = every tick, 2 = every other tick
  heavy-check-interval: 2
  # Run checks off the main thread (false = main thread, safer but laggier)
  async-checks: true
  # Use Java 21+ virtual threads for check execution
  virtual-threads: true

bypass:
  # Gamemodes that auto-exempt from ALL checks
  gamemodes:
    - creative
    - spectator
  # Worlds where ALL checks are disabled
  worlds: []
  # Respect nyx.bypass.* permissions
  permission-bypass: true

# +-----------------------------------------------------------------------+
#  CHECKS  —  threshold, actions                                          |
# +-----------------------------------------------------------------------+
#  threshold:     VL at which an alert is sent (0 = every flag)
#  decay:         VL removed every second (higher = faster forgiveness)
#  max-violations:VL at which the highest action triggers
#  sensitivity:   0.0 (very lenient)  –  1.0 (very strict)
#  autoban:       false to disable auto-ban for THIS check only. All three ban
#                 paths (high VL, repeated setbacks, repeated kicks) are skipped;
#                 the player is still setback/kicked as configured.
#  setbacks-to-ban: how many setbacks on the SAME check before it escalates
#                   to a time-based ban (0 = never ban via setbacks)
#  kicks-to-ban:   how many kicks on the SAME check before it escalates to a
#                  time-based ban (0 = never ban via kicks)
#  actions:       Available: alert, setback, kick, ban, cmd:<command>
#                 Use " @ N" suffix to delay the action until VL ≥ N
#                 Examples:
#                   - "alert"                    → always alert
#                   - "setback @ 20"             → setback at VL 20
#                   - "kick @ 50"                → kick at VL 50
#                   - "ban @ 75"                 → time-based ban at VL 75 (3d default)
#                   - "cmd:tempban %player% 3d"  → custom command at VL 0
#
#  NOTE: `punishment.ban.autoban-enabled` (the global master switch) disables
#  auto-ban for ALL checks at once. Per-check `autoban: false` disables it for
#  just that check. The manual /nyx ban command is never affected.
#
#  THREE independent ways a check can end in a TIME-BASED ban (3d default):
#    1. HIGH VL — a `ban @ <very high VL>` action (continuous, sustained cheat).
#    2. REPEATED SETBACKS — the same check setbacks the player `setbacks-to-ban`
#       times (bursts of cheating across decay gaps). Generous by default to
#       avoid punishing laggy players.
#    3. REPEATED KICKS — the same check kicks the player `kicks-to-ban` times.
#       Less mercy by default: after a handful of kicks they've clearly been
#       caught repeatedly, so the ban threshold is lower than setbacks.
#  Because VL/setback/kick counts decay and persist, only genuine, ongoing
#  cheating accumulates enough to trigger a ban.
# +-----------------------------------------------------------------------+

checks:
  # ——— MOVEMENT ———
  speed:
    enabled: true
    description: "Detects horizontal/vertical speed above vanilla limits"
    autoban: true
    setbacks-to-ban: 6
    kicks-to-ban: 3
