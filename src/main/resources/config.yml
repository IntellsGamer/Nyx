punishment:
  # Broadcast punishment actions to the server
  broadcast: true
  # Delay before executing the punishment (ticks, 20 = 1 sec)
  delay: 0
  # Console commands executed on punishment (use %player% %check% placeholders)
  commands:
    kick: "kick %player% §c[Nyx] §fUnfair Advantage §7(%check%)"
  # Anti-cheat bans are TIME-BASED (never permanent) by default.
  ban:
    # Master switch: completely disable ALL automatic anti-cheat bans.
    # When false, no check can auto-ban (VL, setback-count or kick-count
    # paths are all disabled). The manual /nyx ban command still works.
    autoban-enabled: true
    # Duration of anti-cheat bans. Supports s/m/h/d/w units: 30s, 45m, 12h, 3d, 2w
    duration: 3d
    # Reason shown to the banned player (%check% placeholder supported)
    reason: "§c[Nyx] §fUnfair Advantage §7(%check%)"
    # If LiteBans is installed Nyx uses this console command. Placeholders:
    #   %player% %check% %reason% %time%  (%time% = the parsed duration, e.g. "7d")
    litebans-command: "litebans:ban %player% %time% %reason%"
    # If LiteBans is installed Nyx uses this console command to unban
    # (used by /nyx unban). Placeholders: %player%
    litebans-unban-command: "litebans:unban %player%"

storage:
  # Persist global violation levels across reconnects and server restarts
  # using a self-contained SQLite database (plugins/Nyx/nyx.db). Cheaters no
  # longer reset to zero just by rejoining.
  persist-global-violations: true

discord:
  # Discord webhook URL (leave empty to disable)
  webhook-url: ""
  # Cooldown between webhook pings (seconds)
  cooldown: 5
  # Embed appearance
  embed:
    color: 16720980
    footer: "Nyx Anticheat"
    show-server: true
    show-ping: true

geyser:
  # Auto-exempt Geyser/Floodgate Bedrock players (reduces false flags)
  enabled: true
  # Use reduced sensitivity for Bedrock players
  reduced-sensitivity: true

gui:
  # Title for the check-toggling inventory (MiniMessage)
  title: "<gradient:#ff6b6b:#ffd93d>Nyx Checks</gradient>"
  rows: 3
