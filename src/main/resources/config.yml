    threshold: 5
    decay: 3
    max-violations: 15
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 15"

  entitycontrol:
    enabled: true
    description: "Detects riding a rideable without the correct control item"
    threshold: 5
    decay: 3
    max-violations: 15
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 15"

  boat:
    enabled: true
    description: "Detects spoofed boat packets or incorrect paddle states"
    threshold: 5
    decay: 3
    max-violations: 15
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 15"

  elytraa:
    enabled: true
    description: "Detects starting to glide while already gliding"
    threshold: 3
    decay: 3
    max-violations: 10
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 10"

  elytrab:
    enabled: true
    description: "Detects starting to glide without jumping"
    threshold: 3
    decay: 3
    max-violations: 10
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 10"

  elytrac:
    enabled: true
    description: "Detects starting to glide too frequently"
    threshold: 3
    decay: 3
    max-violations: 10
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 10"

  extraelytra:
    enabled: true
    description: "Detects ExtraElytra hacks (packet spam, speed/height control)"
    threshold: 5
    decay: 3
    max-violations: 15
    sensitivity: 0.85
    actions:
      - "alert"
      - "kick @ 15"

  tridenta:
    enabled: true
    description: "Detects attempting riptide while not in water"
    threshold: 3
    decay: 3
    max-violations: 10
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 10"

  tridentb:
    enabled: true
    description: "Detects riptide spamming (too frequent)"
    threshold: 3
    decay: 3
    max-violations: 10
    sensitivity: 0.9
    actions:
      - "alert"
      - "kick @ 10"

  # ——— OTHER ———
  badpackets:
    enabled: true
    description: "Detects impossible packets (NaN, speed > 100, invalid pitch)"
    threshold: 5
    decay: 5
    max-violations: 15
    sensitivity: 0.95
    actions:
      - "alert"
      - "kick @ 15"

  inventorymove:
    enabled: true
    description: "Detects moving while a non-crafting inventory is open"
    threshold: 8
    decay: 2
    max-violations: 20
    sensitivity: 0.8
    actions:
      - "alert"
      - "setback @ 15"
      - "kick @ 20"

  fastbreak:
    enabled: true
    description: "Detects FastBreak / Nuker block-breaking exploits (premature STOP_DESTROY packets)"
    threshold: 5
    decay: 3
    max-violations: 20
    sensitivity: 0.85
    actions:
      - "alert"
      - "kick @ 20"

  fastplace:
    enabled: true
    description: "Detects FastPlace / AutoBuild placement-speed exploits"
    threshold: 10
    decay: 2
    max-violations: 25
    sensitivity: 0.8
    actions:
      - "alert"
      - "kick @ 25"

  fastuse:
    enabled: true
    description: "Detects fast-item-use and auto-soup"
    threshold: 10
    decay: 2
    max-violations: 25
    sensitivity: 0.8
    actions:
      - "alert"
      - "kick @ 25"

  web:
    enabled: true
    description: "Detects walking through cobwebs at normal speed (NoWeb)"
    threshold: 3
    decay: 4
    max-violations: 10
    sensitivity: 0.8
    actions:
      - "alert"
      - "setback @ 6"
      - "kick @ 10"

punishment:
  # Broadcast punishment actions to the server
  broadcast: true
  # Delay before executing the punishment (ticks, 20 = 1 sec)
  delay: 0
  # Console commands executed on punishment (use %player% %check% placeholders)
  commands:
    kick: "kick %player% §cCheating detected! [%check%]"
    ban: "ban %player% §cCheating detected! [%check%]"

discord:
  # Discord webhook URL (leave empty to disable)
  webhook-url: ""
  # Cooldown between webhook pings (seconds)
  cooldown: 5
  # Embed appearance
  embed:
    color: 16720980
    footer: "Nyx Anticheat v1.0.2"
    show-server: true
    show-ping: true

geyser:
  # Auto-exempt Geyser/Floodgate Bedrock players (reduces false flags)
  enabled: true
  # Use reduced sensitivity for Bedrock players
  reduced-sensitivity: true

gui:
  # Title for the check-toggling inventory (MiniMessage)
  title: "<gradient:#ff6b6b:#ffd93d>Nyx Checks</gradient>"
  rows: 3
