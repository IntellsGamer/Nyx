name: Publish Nyx Release Jars

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated Minecraft versions to publish (e.g. 1.21.4 1.21.5 1.21.6 1.21.11 26.2)'
        required: false
        default: '1.21.4 1.21.5 1.21.6 1.21.11 26.2'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 25 is required to compile the 26.2 module (Paper 26.x ships Java 25 bytecode).
          java-version: '25'

      - name: Build shade jars
        run: mvn -q -DskipTests clean package

      - name: Publish / update releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Plugin version is the root project version (e.g. 1.2.0). Jars are named
          # "<mc-version>+<plugin-version>" while releases stay tagged by the MC version.
          NYX_VERSION=$(grep -oPm1 '(?<=<version>)[0-9]+\.[0-9]+\.[0-9]+' pom.xml)
          echo "Plugin version: $NYX_VERSION"

          read -r -a vers <<< "${{ inputs.versions }}"
          # Sort into canonical ascending MC order (numeric major.minor.patch). The
          # highest version always ends up last and is therefore the one marked
          # `--latest`, regardless of the order the input was typed in. E.g. 26.2
          # (major 26) always sorts after every 1.21.x and stays the latest release.
          mapfile -t vers < <(printf '%s\n' "${vers[@]}" | sort -t. -k1,1n -k2,2n -k3,3n)
          last=$(( ${#vers[@]} - 1 ))
          i=0
          for v in "${vers[@]}"; do
            jar="$GITHUB_WORKSPACE/$v/target/Nyx-$v+$NYX_VERSION.jar"

            if [ ! -f "$jar" ]; then
              echo "::error::Missing built jar: $jar (is $v a valid module?)"
              exit 1
            fi

            if [ "$i" -eq "$last" ]; then
              latest_flag="--latest"
            else
              latest_flag="--latest=false"
            fi
            i=$((i + 1))

            if gh release view "$v" >/dev/null 2>&1; then
              echo "Release $v exists -> updating assets with --clobber"
              gh release upload "$v" "$jar" --clobber
              gh release edit "$v" "$latest_flag" --draft=false
            else
              echo "Creating release $v"
              gh release create "$v" "$jar" "$latest_flag" \
                --title "Nyx $v" \
                --notes "Nyx $v+$NYX_VERSION — Nullify Your Xploits. Specialized build for Paper $v."
            fi
          done