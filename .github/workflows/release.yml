name: Publish Nyx Release Jars

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated Minecraft versions to publish (e.g. 26.2 1.21.5 1.21.6 1.21.11)'
        required: false
        default: '26.2 1.21.5 1.21.6 1.21.11'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 25 is required to compile the 26.2 module (Paper 26.x ships Java 25 bytecode).
          java-version: '25'

      - name: Build shade jars
        run: mvn -q -DskipTests clean package

      - name: Publish / update releases and store in repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Plugin version is the root project version (e.g. 1.1.0). Jar files are
          # named "<mc-version>+<plugin-version>" (e.g. Nyx-1.21.5+1.1.0.jar), but
          # releases stay tagged by the Minecraft version (1.21.5/1.21.6/1.21.11).
          NYX_VERSION=$(grep -oPm1 '(?<=<version>)[0-9]+\.[0-9]+\.[0-9]+' pom.xml)
          echo "Plugin version: $NYX_VERSION"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          for v in ${{ inputs.versions }}; do
            jar="$GITHUB_WORKSPACE/$v/target/Nyx-$v+$NYX_VERSION.jar"

            if [ ! -f "$jar" ]; then
              echo "::error::Missing built jar: $jar (is $v a valid module?)"
              exit 1
            fi

            # Copy jar to version folder in repo
            repo_jar="$GITHUB_WORKSPACE/$v/Nyx-$v+$NYX_VERSION.jar"
            cp "$jar" "$repo_jar"
            git add "$repo_jar"

            # Handle GitHub Release
            if gh release view "$v" >/dev/null 2>&1; then
              echo "Release $v exists -> updating assets with --clobber"
              gh release upload "$v" "$jar" --clobber
            else
              echo "Creating release $v"
              gh release create "$v" "$jar" \
                --title "Nyx $v" \
                --notes "Nyx $v+$NYX_VERSION — Nullify Your Xploits. Specialized build for Paper $v."
            fi
          done
          
          # Commit and push all added JARs
          git commit -m "Update Nyx JARs for versions: ${{ inputs.versions }} (v$NYX_VERSION)"
          git push
